version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: downloader_backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - DB_ADAPTER=supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - TEMP_STORAGE_PATH=/tmp/downloader
      - MAX_OUTPUT_SIZE_BYTES=2147483648
      - MAX_JOB_DURATION_SECONDS=600
      - JOB_EXPIRATION_MINUTES=30
      - MAX_CONCURRENT_JOBS_GLOBAL=5
      - MAX_CONCURRENT_JOBS_PER_SESSION=2
    volumes:
      - temp_storage:/tmp/downloader
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: downloader_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  temp_storage:
