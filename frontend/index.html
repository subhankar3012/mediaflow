    <!-- 20-Second Ad Popunder Cooldown Controller -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;
        var COOLDOWN_MS = 20000; // 20s cooldown between popunders
        var lastPopTime = 0;
        try {
          lastPopTime = parseInt(sessionStorage.getItem('mf_pop_cooldown') || '0', 10);
        } catch (e) {}

        var origOpen = window.open;
        window.open = function(url, target, features) {
          // Detect popunder or popup window opens
          var isPopup = !target || target === '_blank' || target === '_new';
          if (isPopup) {
            var now = Date.now();
            if (lastPopTime && (now - lastPopTime < COOLDOWN_MS)) {
              // Within 20s cooldown: suppress duplicate popunder
              return null;
            }
            // Allow popunder and start 20s cooldown
            lastPopTime = now;
            try {
              sessionStorage.setItem('mf_pop_cooldown', now.toString());
            } catch (e) {}
          }
          return origOpen.apply(window, arguments);
        };
      })();
    </script>
