    <!-- Monetag Smart Ad Suite (Staggered Low-Irritation Loading) -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;

        function injectMonetag(src, zone) {
          if (document.querySelector('script[data-zone="' + zone + '"]')) return;
          var s = document.createElement('script');
          s.dataset.zone = zone;
          s.src = src;
          s.async = true;
          s.setAttribute('data-cfasync', 'false');
          var target = [document.documentElement, document.body, document.head].filter(Boolean).pop();
          if (target) target.appendChild(s);
        }

        // 1. In-Page Push (Zone 11880513) - Subtle floating notification at 5s
